# Example configuration for the fraud-case-agent capstone.
#
# Copy to application-local.yml (or export as environment variables) and
# adjust for your environment. NEVER commit real credentials, API keys,
# passwords or tokens. Placeholders below are intentional.
#
# Default rules mode requires NO AI provider, vector store, credentials or
# external database: persistence is an embedded, in-memory H2 database
# migrated by Flyway.

spring:
  application:
    name: fraud-case-agent
  datasource:
    url: jdbc:h2:mem:fraudcasedb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate verifies it
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        # Read-only operational endpoints only. env/configprops/beans/
        # heapdump-type endpoints stay unexposed.
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true            # exposes the static info.* block, not env vars

info:
  app:
    name: fraud-case-agent
    description: Synthetic payment fraud investigation assistant (capstone)
    human-review-required: true

# ---------------------------------------------------------------------------
# Capstone settings. Safety values are startup-validated invariants; setting
# human-review-required=false, allow-financial-actions=true or
# allow-customer-contact=true will fail application startup.
# ---------------------------------------------------------------------------
capstone:
  # Analysis implementation: rules | spring-ai
  processor-mode: rules
  human-review-required: true
  allow-financial-actions: false
  allow-customer-contact: false
  retrieval:
    # Phase 4 policy grounding. When false, no embedding/vector/retrieval
    # beans exist; rules mode is unaffected and spring-ai mode abstains.
    enabled: true
    top-k: 4                   # max policy passages supplied to the model
    similarity-threshold: 0.72 # application-enforced minimum match score
  review:
    # Phase 6 human review. Synthetic identity seam — replaceable by an
    # authenticated ReviewerIdentityProvider when real security lands.
    actor-id: TRAINING-REVIEWER-001
    actor-role: REVIEWER       # ANALYST/AUDITOR cannot disposition cases
  memory:
    max-messages: 12
  tools:
    timeout-ms: 2500
    deterministic-seed: fraud-training-v1
  ai:
    # Spring AI adapter bounds (Phase 3). Ignored in rules mode.
    timeout-ms: 10000          # per model-invocation connect/read bound
    temperature: 0.0           # keep output stable
    max-tool-calls: 6          # model-driven tool-call budget per investigation
    max-rounds: 4              # tool-call loop bound per investigation
    max-output-tokens: 1024    # bound on the structured answer

# ---------------------------------------------------------------------------
# SPRING AI MODE (Phase 3) — uncomment to enable. Requires a real provider
# credential supplied via environment variable; it is never committed.
# With mode=spring-ai but no configured model the application refuses to
# start (fail-safe configuration error). At runtime any provider failure or
# invalid model output falls back to the deterministic rules processor and
# is persisted/audited as mode RULES_FALLBACK.
#
# capstone:
#   processor-mode: spring-ai
#
# spring:
#   ai:
#     anthropic:
#       api-key: ${ANTHROPIC_API_KEY}   # environment variable only
#       chat:
#         options:
#           model: claude-sonnet-4-5    # pin per environment
#
# ---------------------------------------------------------------------------
# FUTURE (later phases only — nothing below is active yet):
#
#   datasource:                         # to move off embedded H2 later
#     url: jdbc:<db>://<host>/<schema>
#     username: ${DB_USERNAME}
#     password: ${DB_PASSWORD}
# ---------------------------------------------------------------------------
