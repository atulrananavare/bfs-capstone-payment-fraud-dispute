spring:
  application:
    name: fraud-case-agent
  autoconfigure:
    exclude:
      # HTTP security is CSRF-only (Phase 7); the identity seam supplies
      # principals — no generated user/password noise is needed.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    deserialization:
      # Clients must not smuggle server-managed fields (caseId, analystId)
      # or other unexpected properties into requests.
      fail-on-unknown-properties: true
  # Embedded H2 for the synthetic training application. No external database
  # or credentials are required. Flyway owns the schema; Hibernate validates it.
  datasource:
    url: jdbc:h2:mem:fraudcasedb;DB_CLOSE_DELAY=-1;MODE=LEGACY
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    # Raw model output must never reach logs. Spring AI's converter logs the
    # full model text at ERROR when JSON parsing fails — suppress it;
    # rejection is still audited via MODEL_OUTPUT_REJECTED.
    org.springframework.ai.converter.BeanOutputConverter: OFF
  pattern:
    # Include the per-request correlation id (Phase 9) after the level.
    # Bounded MDC values only — no payload, prompt or customer text.
    level: "%5p [%X{requestId:-}][%X{caseId:-}]"

management:
  endpoints:
    web:
      exposure:
        # Read-only operational endpoints only. No env/configprops/beans/
        # heapdump-type endpoints — they can expose configuration internals.
        include: health,info,metrics
  endpoint:
    health:
      # Never expose component details, credentials or internals.
      show-details: never
  info:
    env:
      # Enables the static info.* block below — not environment variables.
      enabled: true

info:
  app:
    name: fraud-case-agent
    description: Synthetic payment fraud investigation assistant (capstone)
    human-review-required: true

capstone:
  # Processor implementations: rules | spring-ai.
  # rules: deterministic, no model/provider/credential required.
  # spring-ai: Spring AI adapter; requires spring.ai.anthropic.api-key
  #   (environment variable only — never committed) and falls back to the
  #   deterministic rules processor on any provider failure or invalid output.
  processor-mode: rules
  # Safety invariants. These values are validated at startup; unsafe overrides fail fast.
  human-review-required: true
  allow-financial-actions: false
  allow-customer-contact: false
  retrieval:
    enabled: true
    top-k: 4
    similarity-threshold: 0.72
  review:
    # Synthetic training reviewer identity (Phase 6). Application-supplied;
    # never read from request payloads.
    actor-id: TRAINING-REVIEWER-001
    actor-role: REVIEWER
  memory:
    max-messages: 12
  tools:
    timeout-ms: 2500
    deterministic-seed: fraud-training-v1
  ai:
    # Bounds for the Spring AI adapter. Ignored in rules mode.
    timeout-ms: 10000
    temperature: 0.0
    max-tool-calls: 6
    max-rounds: 4
    max-output-tokens: 1024
